name: burner
description: "Burner — a movies & TV streaming app powered by Stremio addons, with an HBO Max style UI."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  cached_network_image: ^3.3.1
  video_player: ^2.8.6
  chewie: ^1.8.1
  wakelock_plus: ^1.2.5
  url_launcher: ^6.3.0
  cupertino_icons: ^1.0.8
  # Telegram account login talks to TDLib through dart:ffi.
  ffi: ^2.1.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
