name: Build Android APK

# Builds never run on ordinary code pushes.
# They start either from the Actions tab (Run workflow) or when the .buildnow
# file changes, which is the on-demand switch used from chat.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".buildnow"

env:
  # Prebuilt TDLib shared libraries for Android (libtdjson.so per ABI).
  # Building TDLib from source needs ~40-80 min and kept failing silently, so
  # the APK shipped without Telegram support. These are the same libs, prebuilt.
  TDLIB_JNILIBS_URL: https://github.com/up9cloud/android-libtdjson/releases/download/v1.8.65/jniLibs.tar.gz

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------------- TDLib
      # Downloaded before the app steps, but bundled AFTER `flutter create` so
      # the generated android/ tree cannot clobber the libs.
      - name: Cache prebuilt TDLib
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: tdlib-prebuilt
          key: tdlib-prebuilt-v1.8.65

      - name: Download prebuilt TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p tdlib-prebuilt
          echo "Downloading $TDLIB_JNILIBS_URL"
          curl -fsSL --retry 3 --retry-delay 5 -o jniLibs.tar.gz "$TDLIB_JNILIBS_URL"
          ls -l jniLibs.tar.gz
          tar -xzf jniLibs.tar.gz -C tdlib-prebuilt
          echo "--- extracted tree ---"
          find tdlib-prebuilt -name 'libtdjson.so' -printf '%p  %s bytes\n'

      # ------------------------------------------------------------------ App
      - name: Generate Android platform files
        run: flutter create . --project-name burner --org com.burner.app --platforms=android

      - name: Bundle libtdjson into the app
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src=$(find tdlib-prebuilt -type f -path "*/$abi/libtdjson.so" | head -n 1 || true)
            if [ -n "$src" ]; then
              mkdir -p "android/app/src/main/jniLibs/$abi"
              cp "$src" "android/app/src/main/jniLibs/$abi/libtdjson.so"
              echo "bundled $abi from $src"
            else
              echo "WARNING: no libtdjson.so found for $abi"
            fi
          done
          echo "--- jniLibs ---"
          ls -lR android/app/src/main/jniLibs

      # Hard gate: Telegram login is a shipped feature, so a missing native
      # library must fail the build loudly instead of producing an APK that
      # tells the user "Telegram login not available in this build".
      - name: Verify TDLib is bundled
        run: |
          set -euo pipefail
          if [ ! -f android/app/src/main/jniLibs/arm64-v8a/libtdjson.so ]; then
            echo "::error::libtdjson.so missing for arm64-v8a - Telegram login would be disabled in this APK"
            exit 1
          fi
          size=$(stat -c%s android/app/src/main/jniLibs/arm64-v8a/libtdjson.so)
          echo "arm64-v8a libtdjson.so = $size bytes"
          if [ "$size" -lt 1000000 ]; then
            echo "::error::libtdjson.so looks truncated ($size bytes)"
            exit 1
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Confirm libtdjson made it into the APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ -f "$apk" ]; then
            if unzip -l "$apk" | grep -q 'lib/arm64-v8a/libtdjson.so'; then
              echo "libtdjson.so is inside $apk"
            else
              echo "::error::libtdjson.so is NOT inside $apk"
              unzip -l "$apk" | grep 'lib/' || true
              exit 1
            fi
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: burner-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
